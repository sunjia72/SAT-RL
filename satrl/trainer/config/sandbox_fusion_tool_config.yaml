tools:
- class_name: verl.tools.sandbox_fusion_tools.SandboxFusionTool
  config:
    type: native
    sandbox_fusion_url: "http://${oc.env:SF_HOST,localhost}:${oc.env:SF_PORT,10080}/run_code"
    num_workers: 192
    enable_global_rate_limit: false
    rate_limit: 192
    default_timeout: 30
    default_language: python
  tool_schema:
    type: function
    function:
      name: code_interpreter
      description: A tool for executing code.
      parameters:
        type: object
        properties:
          code:
            type: string
            description: The code to execute.
        required:
        - code
